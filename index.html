<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel Bir Sürpriz ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library for Romantic Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .font-serif-romantic {
            font-family: 'Playfair Display', serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        /* Floating Hearts Background Animation */
        .heart-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Shake animation for wrong password */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen relative flex items-center justify-center p-4 overflow-x-hidden">

    <!-- Floating Background Hearts -->
    <div id="hearts-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- LOCK SCREEN CARD -->
    <div id="lock-screen" class="glass-card w-full max-w-md rounded-3xl p-8 text-center text-white z-10 transition-all duration-700 transform scale-100 opacity-100">
        <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner border border-white/30 backdrop-blur-md">
            <i class="fa-solid fa-heart text-red-500 text-4xl animate-pulse"></i>
        </div>

        <h1 class="text-3xl font-bold font-serif-romantic mb-6 tracking-wide">Sana Özel Bir Sürpriz ❤️</h1>

        <!-- Form -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div class="relative">
                <input 
                    type="password" 
                    id="password-input" 
                    placeholder="Şifreyi buraya yaz..." 
                    class="w-full px-5 py-3.5 rounded-full bg-white/20 border border-white/40 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-rose-300 focus:bg-white/30 text-center text-lg tracking-widest transition"
                    required
                >
            </div>

            <button 
                type="submit" 
                class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-semibold shadow-lg hover:shadow-rose-500/30 transition transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center space-x-2"
            >
                <span>Sürprizi Aç</span>
                <i class="fa-solid fa-key text-xs"></i>
            </button>
        </form>

        <!-- Error Message -->
        <div id="error-message" class="hidden mt-4 text-rose-200 text-sm bg-rose-900/40 py-2 px-4 rounded-xl border border-rose-500/30">
            <i class="fa-solid fa-circle-exclamation mr-1"></i> Hatalı şifre, tekrar dene sevgilim :)
        </div>
    </div>

    <!-- MAIN CONTENT UNLOCKED SCREEN (Initially Hidden) -->
    <div id="content-screen" class="hidden w-full max-w-4xl z-10 my-8 transition-all duration-700 opacity-0 transform translate-y-8">
        <div class="glass-card rounded-3xl p-6 sm:p-10 text-white shadow-2xl backdrop-blur-xl border border-white/30">
            
            <!-- Header Section -->
            <div class="flex flex-col sm:flex-row items-center justify-between border-b border-white/20 pb-6 mb-8 gap-4">
                <div class="text-center sm:text-left">
                    <span class="text-xs uppercase tracking-widest text-pink-200 font-semibold">öptüm</span>
                    <h1 class="text-3xl sm:text-5xl font-bold font-serif-romantic text-white mt-1">İyi ki Varsın Sevgilim ❤️</h1>
                </div>
                <button 
                    onclick="lockPage()" 
                    class="px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 border border-white/30 text-xs text-white/80 transition flex items-center space-x-2"
                >
                    <i class="fa-solid fa-lock"></i>
                    <span>Kilitle</span>
                </button>
            </div>

            <!-- Video Container (Yerel MP4 Video) -->
            <div class="mb-10 flex justify-center">
                <div class="relative w-full max-w-xs rounded-2xl overflow-hidden shadow-2xl bg-black/40 border border-white/20 aspect-[9/16]">
                    <video 
                        class="w-full h-full object-cover" 
                        controls 
                        playsinline>
                        <source src="video.mp4" type="video/mp4">
                        Tarayıcınız video etiketini desteklemiyor.
                    </video>
                </div>
            </div>

            <!-- Romantic Message Card -->
            <div class="bg-white/10 rounded-2xl p-6 mb-8 border border-white/20">
                <h3 class="text-xl font-semibold font-serif-romantic mb-3 text-pink-200 flex items-center gap-2">
                    <i class="fa-solid fa-quote-left text-rose-300"></i> Aşk
                </h3>
                <p class="text-white/90 leading-relaxed italic">
                    "Eşşek değilsin ya tabikide 29 ekimde çiçek alcaksın"
                </p>
            </div>

            <!-- Photo Gallery Grid -->
            <div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <!-- 1. Fotoğraf -->
                    <div class="group relative aspect-square rounded-xl overflow-hidden border border-white/30 bg-white/10 shadow-md transition transform hover:scale-105">
                        <img src="1.jpeg" alt="Özel Anımız 1" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent opacity-0 group-hover:opacity-100 transition flex items-end p-3">
                            <span class="text-xs text-white font-medium">aşk ✨</span>
                        </div>
                    </div>
                    <!-- 2. Fotoğraf -->
                    <div class="group relative aspect-square rounded-xl overflow-hidden border border-white/30 bg-white/10 shadow-md transition transform hover:scale-105">
                        <img src="2.jpeg" alt="Özel Anımız 2" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent opacity-0 group-hover:opacity-100 transition flex items-end p-3">
                            <span class="text-xs text-white font-medium">birtanem 💖</span>
                        </div>
                    </div>
                    <!-- 3. Fotoğraf -->
                    <div class="group relative aspect-square rounded-xl overflow-hidden border border-white/30 bg-white/10 shadow-md transition transform hover:scale-105 col-span-2 sm:col-span-1">
                        <img src="3.jpeg" alt="Özel Anımız 3" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent opacity-0 group-hover:opacity-100 transition flex items-end p-3">
                            <span class="text-xs text-white font-medium">Unutulmaz Anlar 🌹</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-10 pt-6 border-t border-white/20 text-center text-xs text-white/60">
                Seni Çok Seviyorum ❤️ | Her Hakkı Bende Saklıdır İtirazın varsa Söyle Alıyım Façanı
            </div>

        </div>
    </div>

    <!-- JavaScript Controls -->
    <script>
        const CORRECT_PASSWORD = "0309";

        function createHeart() {
            const heartsContainer = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            
            const icons = ['fa-heart', 'fa-heart text-pink-300', 'fa-heart text-rose-300', 'fa-heart text-red-400'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            
            heart.innerHTML = `<i class="fa-solid ${randomIcon} text-lg"></i>`;
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';

            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createHeart, 600);

        function handleLogin(event) {
            event.preventDefault();
            const passwordInput = document.getElementById('password-input');
            const lockScreen = document.getElementById('lock-screen');
            const contentScreen = document.getElementById('content-screen');
            const errorMessage = document.getElementById('error-message');

            if (passwordInput.value === CORRECT_PASSWORD) {
                errorMessage.classList.add('hidden');
                triggerHeartConfetti();

                lockScreen.classList.remove('scale-100', 'opacity-100');
                lockScreen.classList.add('scale-95', 'opacity-0');
                
                setTimeout(() => {
                    lockScreen.classList.add('hidden');
                    contentScreen.classList.remove('hidden');
                    
                    setTimeout(() => {
                        contentScreen.classList.remove('opacity-0', 'translate-y-8');
                        contentScreen.classList.add('opacity-100', 'translate-y-0');
                    }, 50);

                }, 500);

            } else {
                lockScreen.classList.add('shake');
                errorMessage.classList.remove('hidden');
                passwordInput.value = '';
                passwordInput.focus();

                setTimeout(() => {
                    lockScreen.classList.remove('shake');
                }, 400);
            }
        }

        function triggerHeartConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function lockPage() {
            const lockScreen = document.getElementById('lock-screen');
            const contentScreen = document.getElementById('content-screen');
            const passwordInput = document.getElementById('password-input');

            contentScreen.classList.remove('opacity-100', 'translate-y-0');
            contentScreen.classList.add('opacity-0', 'translate-y-8');

            setTimeout(() => {
                contentScreen.classList.add('hidden');
                lockScreen.classList.remove('hidden');
                
                setTimeout(() => {
                    lockScreen.classList.remove('scale-95', 'opacity-0');
                    lockScreen.classList.add('scale-100', 'opacity-100');
                    passwordInput.value = '';
                }, 50);
            }, 500);
        }
    </script>
</body>
</html>
